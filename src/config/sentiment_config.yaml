# Sentiment Analysis Configuration
# -------------------------------
# Thresholds for sentiment classification:
# - Values > threshold_positive are considered positive
# - Values < threshold_negative are considered negative
# - Values in between are considered neutral
threshold_positive: 1.0    # Positive sentiment threshold (default: 1.0)
threshold_negative: -1.0   # Negative sentiment threshold (default: -1.0)

# Path to sentiment lexicon file
# Format: word,score,label (CSV)
# Example: good,2,positive
lexicon_path: "../data/lexicon/lexicon.csv"

# Optional settings
logging:
  level: INFO          # Logging level (DEBUG, INFO, WARNING, ERROR)
  file: "sentiment.log"  # Log file path (relative to execution directory)