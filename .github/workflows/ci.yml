name: CI
on: [push]

jobs:
  files_existing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check required files exist
        id: check_files
        run: |
          echo "Checking required files..."
          MISSING_FILES=()
          REQUIRED_FILES=(
            src/sentiment/mapper_sentiment.py
            src/sentiment/reducer_sentiment.py
            src/sentiment/lexicon.py
            src/wordcount/mapper_wordcount.py
            src/wordcount/reducer_wordcount.py
            src/run_pipeline.py
            src/preprocess.py
            src/utils/data_cli.py
            src/utils/data_ingestion.py
            src/utils/data_preprocessor.py
            src/utils/logging_config.py
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING_FILES+=("$file")
            fi
          done

          if [ ${#MISSING_FILES[@]} -ne 0 ]; then
            echo "❌ Missing files:"
            for f in "${MISSING_FILES[@]}"; do
              echo "- $f"
            done
            exit 1
          else
            echo "✅ All required files are present."
          fi
  lint:
    needs: files_existing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install pylint
        run: pip install pylint
      - name: Linter result
        run: |
          pylint_score=$(pylint --exit-zero src/ tests/ | grep -oP 'at \K\d+\.\d+')
          echo "Linter score(out of 10): $pylint_score"
          awk -v score="$pylint_score" 'BEGIN {exit !(score >= 0)}'

  Unit_tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.9"
      - name: Installing requiered packages
        run: pip install -r requirements.txt
      
      - name: Test wordcount
        run: pytest tests/test_wordcount/*

      - name: Test sentiment
        run: pytest tests/test_sentiment/*

      - name: Test utils
        run: pytest tests/test_utils/*

  sample_test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pip install pytest
          pytest

      - name: Set up Java and Hadoop
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jdk wget unzip

          wget https://downloads.apache.org/hadoop/common/hadoop-3.3.6/hadoop-3.3.6.tar.gz
          tar -xzf hadoop-3.3.6.tar.gz
          mv hadoop-3.3.6 $HOME/hadoop

          echo "HADOOP_HOME=$HOME/hadoop"   >> $GITHUB_ENV
          echo "$HOME/hadoop/bin"           >> $GITHUB_PATH
          echo "JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV

          cat <<EOF > $HOME/hadoop/etc/hadoop/core-site.xml
          <configuration>
            <property>
              <name>fs.defaultFS</name>
              <value>hdfs://localhost:9000</value>
            </property>
          </configuration>
          EOF

          cat <<EOF > $HOME/hadoop/etc/hadoop/hdfs-site.xml
          <configuration>
            <property>
              <name>dfs.replication</name>
              <value>1</value>
            </property>
            <property>
              <name>dfs.namenode.name.dir</name>
              <value>file://$HOME/hadoop/hdfs/namenode</value>
            </property>
            <property>
              <name>dfs.datanode.data.dir</name>
              <value>file://$HOME/hadoop/hdfs/datanode</value>
            </property>
          </configuration>
          EOF

          $HOME/hadoop/bin/hdfs namenode -format -force
          $HOME/hadoop/sbin/start-dfs.sh

          echo "foo bar foo" > sample.txt
          hadoop fs -mkdir -p /data/sample
          hadoop fs -put sample.txt /data/sample

      - name: Prepare WordCount test file
        run: |
          $HOME/hadoop/bin/hadoop fs -mkdir -p /data/sample/
          $HOME/hadoop/bin/hadoop fs -put sample.txt /data/sample/
          echo "foo bar foo" > data/sample/sample.txt

      - name: Fix line endings in mapper and reducer
        run: |
          sed -i 's/\r$//' src/wordcount/mapper_wordcount.py
          sed -i 's/\r$//' src/wordcount/reducer_wordcount.py
          sed -i 's/\r$//' src/sentiment/mapper_sentiment.py
          sed -i 's/\r$//' src/sentiment/reducer_sentiment.py

      - name: Run Hadoop Streaming with WordCount
        run: |
          cp src/wordcount/mapper_wordcount.py ./mapper_wordcount.py
          cp src/wordcount/reducer_wordcount.py ./reducer_wordcount.py
          $HOME/hadoop/bin/hadoop jar $HOME/hadoop/share/hadoop/tools/lib/hadoop-streaming-*.jar \
            -files mapper_wordcount.py,reducer_wordcount.py \
            -input /data/sample \
            -output /tmp/sample_out \
            -mapper "python3 mapper_wordcount.py" \
            -reducer "python3 reducer_wordcount.py"

      - name: Show WordCount output
        run: |
          $HOME/hadoop/bin/hadoop fs -cat /tmp/sample_out/part-*

  sentiment_analysis_job:
    needs: sample_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install mrjob
          pip install pytest

      - name: Run SentimentAnalysis MRJob
        run: |
          mkdir -p output
          python src/sentiment_analysis_job.py -r local data/sample.txt > output/output.txt

      - name: Verify Output Exists
        run: |
          test -s output/output.txt
