name: CI
on: [push]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install pylint
        run: pip install pylint
      - name: Code linting...
        run: |
          pylint_score=$(pylint --exit-zero src/ tests/ | grep -oP 'at \K\d+\.\d+')
          echo "Linter score(out of 10): $pylint_score"
          awk -v score="$pylint_score" 'BEGIN {exit !(score >= 0)}'

  Unit_tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.9"
      - name: Installing requiered packages
        run: pip install -r requirements.txt
      
      - name: Check the structure
        run: pytest tests/test_structure.py

      - name: Test wordcount
        run: pytest tests/test_wordcount/*

      - name: Test sentiment
        run: pytest tests/test_sentiment/*

      - name: Test utils
        run: pytest tests/test_utils/*
