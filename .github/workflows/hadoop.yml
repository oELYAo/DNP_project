name: Hadoop Streaming Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  hadoop-wordcount:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java and Hadoop
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jdk wget unzip
        wget https://downloads.apache.org/hadoop/common/hadoop-3.3.6/hadoop-3.3.6.tar.gz
        tar -xzf hadoop-3.3.6.tar.gz
        mv hadoop-3.3.6 $HOME/hadoop
        echo "HADOOP_HOME=$HOME/hadoop" >> $GITHUB_ENV
        echo "$HOME/hadoop/bin" >> $GITHUB_PATH
        echo "export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64" >> $GITHUB_ENV

    - name: Prepare test file
      run: |
        echo "foo bar foo" > sample.txt
        $HADOOP_HOME/bin/hadoop fs -mkdir -p /tmp/
        $HADOOP_HOME/bin/hadoop fs -put sample.txt /tmp/

    - name: Run WordCount
      run: |
        $HADOOP_HOME/bin/hadoop jar $HADOOP_HOME/share/hadoop/tools/lib/hadoop-streaming-*.jar \
          -input /tmp/sample.txt \
          -output /tmp/sample_out \
          -mapper src/mapreduce/mapper_wordcount.py \
          -reducer src/mapreduce/reducer_wordcount.py

    - name: Display Output
      run: |
        $HADOOP_HOME/bin/hadoop fs -cat /tmp/sample_out/part-*
